apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: pawprint
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: reporting
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reporting
        image: ghcr.io/mohammadafzalzadeh/pawprint-kubernetes-reporting@sha256:05e1fa332aed008e46acf695f3cf15934d96fe6533462dfddad214ceebdac3aa
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: reporting-config
        env:
        - name: REPORT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-primary-auth
              key: reporting_password
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 50
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
