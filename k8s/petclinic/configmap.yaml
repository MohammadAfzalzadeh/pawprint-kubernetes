apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-db-config
  namespace: pawprint
data:
  SPRING_PROFILES_ACTIVE: postgres
  SPRING_SQL_INIT_MODE: never
  POSTGRES_URL: jdbc:postgresql://postgres-primary.pawprint.svc.cluster.local:5432/petclinic
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
  SERVER_FORWARD_HEADERS_STRATEGY: none
  SERVER_TOMCAT_USE_RELATIVE_REDIRECTS: "true"
  SERVER_SERVLET_SESSION_TRACKING_MODES: cookie
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 25s
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
