apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: pawprint
spec:
  replicas: 2
  minReadySeconds: 4
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: petclinic
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        pawprint.io/config-revision: "2"
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: petclinic
        image: ghcr.io/mohammadafzalzadeh/pawprint-kubernetes-petclinic@sha256:0a94cdce2f652a8ae6e1dd60342b6f419ca6403ec596080813ef20207fee1a4a
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: petclinic-db-config
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-primary-auth
              key: app_user
        - name: POSTGRES_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-primary-auth
              key: app_password
        resources:
          requests:
            cpu: 100m
            memory: 336Mi
          limits:
            cpu: 750m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        lifecycle:
          preStop:
            sleep:
              seconds: 6
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 50
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
