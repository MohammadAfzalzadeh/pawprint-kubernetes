# Documentation template for the keys created by make secrets.
# The example name keeps placeholder data separate from postgres-primary-auth.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-primary-auth-example
  namespace: pawprint
type: Opaque
stringData:
  app_user: "REPLACE_WITH_APPLICATION_ROLE"
  reporting_user: "REPLACE_WITH_REPORTING_ROLE"
  postgres_password: "REPLACE_WITH_POSTGRES_PASSWORD"
  app_password: "REPLACE_WITH_APPLICATION_PASSWORD"
  replication_password: "REPLACE_WITH_REPLICATION_PASSWORD"
  reporting_password: "REPLACE_WITH_REPORTING_PASSWORD"
