---
apiVersion: v1
kind: Service
metadata:
  name: pawprint-postgres-primary-exporter
spec:
  selector: {app.kubernetes.io/name: pawprint-postgres-exporter, pawprint.io/role: primary}
  ports: [{name: metrics, port: 9187, targetPort: metrics}]
---
apiVersion: v1
kind: Service
