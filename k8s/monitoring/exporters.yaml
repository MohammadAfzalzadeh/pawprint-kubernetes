          env: [{name: DATA_SOURCE_NAME, valueFrom: {secretKeyRef: {name: pawprint-postgres-monitoring, key: replica_dsn}}}]
          ports: [{name: metrics, containerPort: 9187}]
          readinessProbe: {httpGet: {path: /metrics, port: metrics}, timeoutSeconds: 5, periodSeconds: 10}
          resources:
