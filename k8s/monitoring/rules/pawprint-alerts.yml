groups:
  - name: pawprint-kubernetes
    rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Node {{ $labels.node }} is not Ready", action: "Inspect node conditions and container runtime."}
      - alert: PodCrashLoopBackOff
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Pod {{ $labels.pod }} is crash-looping", action: "Inspect previous logs and events."}
      - alert: PodFrequentlyRestarting
        expr: increase(kube_pod_container_status_restarts_total[15m]) >= 3
        labels: {severity: warning}
        annotations: {summary: "Container restarted at least three times", action: "Inspect probes, limits and previous logs."}
      - alert: PodImagePullFailure
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"}[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Pod {{ $labels.pod }} cannot pull its image", action: "Inspect the immutable image reference, registry access and pull Secret."}
      - alert: PodOOMKilled
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 0 and on(namespace,pod,container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels: {severity: critical}
        annotations: {summary: "Container {{ $labels.container }} was OOMKilled", action: "Inspect working set and memory request/limit before restarting."}
      - alert: PodUnschedulable
        expr: max_over_time(kube_pod_status_unschedulable[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Pod {{ $labels.pod }} is unschedulable", action: "Inspect resource pressure, affinity, taints and local PV node affinity."}
      - alert: DeploymentReplicaMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Deployment {{ $labels.deployment }} has a replica mismatch", action: "Inspect rollout status and Pod events."}
      - alert: StatefulSetReplicaMismatch
        expr: kube_statefulset_replicas != kube_statefulset_status_replicas_ready
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "StatefulSet {{ $labels.statefulset }} lacks ready replicas", action: "Inspect Pod events without deleting its PVC."}
      - alert: PersistentVolumeClaimPendingOrLost
        expr: kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"} == 1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "PVC {{ $labels.persistentvolumeclaim }} is unhealthy", action: "Inspect PV binding, node affinity and provisioner."}
      - alert: HighNodeCPU
        expr: 100 * (1 - avg by(node)(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Node CPU above 85%", action: "Find high-CPU Pods and verify requests/limits."}
      - alert: HighNodeMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Node memory above 90%", action: "Inspect working sets, OOM events and host pressure."}
      - alert: LowNodeFilesystem
        expr: 100 * node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"} < 10
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Filesystem below 10% free", action: "Inspect usage; do not prune blindly."}
      - alert: PVCUsageBudgetHigh
        expr: 100 * pawprint_pvc_directory_used_bytes / on(namespace,persistentvolumeclaim) kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="pawprint"} > 85
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "PVC {{ $labels.persistentvolumeclaim }} directory usage exceeds 85% of its requested capacity", action: "Inspect growth and backing-node free space; local-path does not enforce this request as a quota."}
      - alert: PVCUsageBudgetExhausted
        expr: 100 * pawprint_pvc_directory_used_bytes / on(namespace,persistentvolumeclaim) kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="pawprint"} > 100
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "PVC {{ $labels.persistentvolumeclaim }} directory usage exceeds requested capacity", action: "Treat this as a capacity-budget breach and inspect node filesystem availability immediately."}
      - alert: HighPodCPUThrottling
        expr: 100 * sum by(namespace,pod)(rate(container_cpu_cfs_throttled_periods_total{namespace="pawprint",pod=~"petclinic-.*|reporting-.*|postgres-primary-.*|postgres-replica-.*",container!=""}[5m])) / clamp_min(sum by(namespace,pod)(rate(container_cpu_cfs_periods_total{namespace="pawprint",pod=~"petclinic-.*|reporting-.*|postgres-primary-.*|postgres-replica-.*",container!=""}[5m])), 0.000001) > 25
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Application or database Pod {{ $labels.pod }} is CPU throttled above 25%", action: "Compare actual CPU, request and limit before changing resources."}
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Prometheus target {{ $labels.job }} is down", action: "Inspect target error and Service endpoints."}
  - name: pawprint-services
    rules:
      - alert: PostgreSQLPrimaryUnavailable
        expr: pg_up{job="postgres-primary"} != 1
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "PostgreSQL Primary is unavailable to its exporter", action: "Check Primary Pod, Service, HBA and monitoring role."}
      - alert: PostgreSQLReplicaUnavailable
        expr: pg_up{job="postgres-replica"} != 1
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "PostgreSQL Replica is unavailable to its exporter", action: "Check Replica Pod, Service and WAL receiver."}
      - alert: ReplicaNotStreaming
        expr: pawprint_replication_streaming{job="postgres-replica"} != 1
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Replica WAL receiver is not streaming", action: "Inspect pg_stat_wal_receiver and Primary pg_stat_replication."}
      - alert: ExcessiveReplicationLag
        expr: pawprint_replication_lag_bytes{job="postgres-replica"} > 16777216
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Replica replay lag exceeds 16 MiB", action: "Inspect WAL receiver, replay progress and node I/O."}
      - alert: ReportingStaleOrDegraded
        expr: pawprint_reporting_stale == 1 or pawprint_reporting_degraded == 1
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Reporting marks Replica data stale/degraded", action: "Inspect status JSON and replication."}
      - alert: PetClinicUnavailable
        expr: probe_success{job="pawprint-http",app="PetClinic"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "PetClinic HTTP endpoint is unavailable", action: "Inspect Ingress, Service endpoints and Pods."}
      - alert: ReportingUnavailable
        expr: probe_success{job="pawprint-http",app="Reporting"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Reporting HTTP endpoint is unavailable", action: "Inspect Reporting, Replica and Ingress."}
      - alert: MonitoringIngressUnavailable
        expr: probe_success{job="monitoring-ingress"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.app }} ingress route is unavailable", action: "Inspect Ingress, authentication response and endpoints."}
      - alert: BackupFailure
        expr: pawprint_backup_failed_jobs > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "A retained backup Job has failed", action: "Inspect Job logs and archive staging cleanup."}
      - alert: BackupOverdue
        expr: time() - pawprint_backup_latest_timestamp_seconds > 25200
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Latest verified backup is older than seven hours", action: "Inspect CronJob, archive integrity and PVC."}
      - alert: BackupIntegrityFailed
        expr: pawprint_backup_archive_integrity != 1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Latest backup SHA256 verification failed", action: "Do not restore it; inspect archive and create a new backup."}
      - alert: RestoreVerificationOverdue
        expr: time() - pawprint_restore_verification_timestamp_seconds > 604800
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "No retained successful restore verification in the last seven days", action: "Run the isolated restore test; a completed backup Job alone does not prove recoverability."}
