apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pawprint-pvc-usage
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: pawprint-pvc-usage}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pawprint-pvc-usage}
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: exporter
          image: ghcr.io/mohammadafzalzadeh/pawprint-kubernetes-reporting@sha256:05e1fa332aed008e46acf695f3cf15934d96fe6533462dfddad214ceebdac3aa
          command: [python, /app/pvc_usage.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports: [{name: metrics, containerPort: 9109}]
          readinessProbe: {httpGet: {path: /metrics, port: metrics}, timeoutSeconds: 5, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /metrics, port: metrics}, timeoutSeconds: 5, periodSeconds: 30}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [DAC_READ_SEARCH]}
          volumeMounts:
            - {name: script, mountPath: /app/pvc_usage.py, subPath: pvc_usage.py, readOnly: true}
            - {name: local-path, mountPath: /local-path, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: script, configMap: {name: pawprint-pvc-usage}}
        - {name: local-path, hostPath: {path: /var/local-path-provisioner, type: DirectoryOrCreate}}
        - {name: tmp, emptyDir: {sizeLimit: 8Mi}}
