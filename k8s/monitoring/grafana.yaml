apiVersion: apps/v1
kind: Deployment
metadata:
  name: pawprint-grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: pawprint-grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pawprint-grafana}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: docker-mirror.liara.ir/grafana/grafana:12.4.15@sha256:2894082f6cf7081aefdc1389265c04000812309208c190d75e8c65f7a30e4b7e
          env:
            - {name: GF_SERVER_ROOT_URL, value: 'http://grafana.pawprint.local:8080/'}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false'}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: pawprint-grafana-admin, key: username}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: pawprint-grafana-admin, key: password}}}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: 'false'}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/pawprint/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: datasource, configMap: {name: pawprint-grafana-datasource}}
        - {name: provider, configMap: {name: pawprint-grafana-provider}}
        - {name: dashboards, configMap: {name: pawprint-grafana-dashboards}}
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
