apiVersion: batch/v1
kind: Job
metadata:
  generateName: petclinic-restore-test-
  namespace: pawprint
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: pg-restore
        image: postgres:18.6-trixie
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - /operations/restore.sh
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        volumeMounts:
        - name: backup
          mountPath: /backup
          readOnly: true
        - name: restore
          mountPath: /restore
        - name: operations
          mountPath: /operations
          readOnly: true
      volumes:
      - name: backup
        persistentVolumeClaim:
          claimName: petclinic-backups
          readOnly: true
      - name: restore
        emptyDir:
          sizeLimit: 1Gi
      - name: operations
        configMap:
          name: pawprint-backup-tools
      enableServiceLinks: false
    metadata:
      labels:
        pawprint.io/disposable-database: 'true'
  ttlSecondsAfterFinished: 86400
