apiVersion: batch/v1
kind: Job
metadata:
  namespace: pawprint
  generateName: petclinic-bootstrap-test-
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 150
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        pawprint.io/disposable-database: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: bootstrap-test
          image: postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command: [bash, /sql/verify-bootstrap.sh]
          resources:
            requests: {cpu: 75m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          volumeMounts:
            - {name: sql, mountPath: /sql, readOnly: true}
            - {name: operations, mountPath: /operations, readOnly: true}
            - {name: primary-init, mountPath: /primary-init, readOnly: true}
            - {name: scratch, mountPath: /restore}
      volumes:
        - name: primary-init
          configMap:
            name: postgres-primary-config
            items:
              - {key: 10-create-roles.sh, path: 10-create-roles.sh}
        - name: sql
          configMap:
            name: pawprint-bootstrap-test
        - name: operations
          configMap:
            name: pawprint-backup-tools
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
