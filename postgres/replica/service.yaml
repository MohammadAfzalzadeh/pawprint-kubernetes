apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: pawprint
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres-replica
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres-replica
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica-peer
  namespace: pawprint
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres-replica
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
