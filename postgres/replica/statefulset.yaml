apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: pawprint
spec:
  serviceName: postgres-replica-peer
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: postgres-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: postgres-replica
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: postgres-primary
      initContainers:
        - name: base-backup
          image: postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ec"]
          args:
            - |
              parent=/var/lib/postgresql/18
              target="$parent/docker"
              install -d -m 0755 -o postgres -g postgres "$parent"
              install -d -m 0700 -o postgres -g postgres /run/replication
              umask 077
              escaped=$(printf '%s' "$REPLICATION_PASSWORD" | sed 's/[\\:]/\\&/g')
              printf '%s:5432:replication:replicator:%s\n' "$PRIMARY_HOST" "$escaped" > /run/replication/pgpass
              chown postgres:postgres /run/replication/pgpass
              unset escaped REPLICATION_PASSWORD
              if [[ -e "$target" ]]; then
                [[ -s "$target/PG_VERSION" && -f "$target/standby.signal" ]] || {
                  echo 'Existing data is not an initialized standby. Inspect it before proceeding.' >&2
                  exit 1
                }
                exit 0
              fi
              staging=$(mktemp -d "$parent/.basebackup.XXXXXXXX")
              chown postgres:postgres "$staging"
              gosu postgres pg_basebackup --no-password --no-clean --wal-method=stream \
                --dbname="host=$PRIMARY_HOST port=5432 user=replicator passfile=/run/replication/pgpass application_name=pawprint-replica connect_timeout=5" \
                --pgdata="$staging" --write-recovery-conf
              [[ -s "$staging/PG_VERSION" && -f "$staging/standby.signal" ]]
              mv -T -- "$staging" "$target"
          env:
            - name: PRIMARY_HOST
              value: postgres-primary.pawprint.svc.cluster.local
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-primary-auth
                  key: replication_password
          volumeMounts:
            - name: replication-auth
              mountPath: /run/replication
            - name: data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          startupProbe:
            exec:
              command: ["gosu", "postgres", "pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - |
                  [[ "$(gosu postgres psql -XAtq -v ON_ERROR_STOP=1 -d postgres -c 'SELECT pg_is_in_recovery()')" == t ]]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["gosu", "postgres", "pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 384Mi
          volumeMounts:
            - name: replication-auth
              mountPath: /run/replication
              readOnly: true
            - name: data
              mountPath: /var/lib/postgresql
            - name: config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true
            - name: config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
      volumes:
        - name: replication-auth
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: postgres-replica-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
